<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Fundacredesa</title>
    <link rel="icon" href="../assets/images/logo_fundacredesa.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/header.css">

    <style>
        body {
            background: var(--gray-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid var(--teal);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: rgba(0, 181, 204, 0.1);
            border-radius: 50%;
            z-index: 0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .login-header img {
            width: 80px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-family: var(--font-ui);
            color: var(--dark);
            font-size: 1.5rem;
        }

        .login-header p {
            color: var(--gray);
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--dark);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .input-icon input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font-text);
            font-size: 0.95rem;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .input-icon input:focus {
            outline: none;
            border-color: var(--teal);
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 181, 204, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            z-index: 1;
        }

        .btn-login:hover {
            background: #0093a6;
        }

        .btn-login:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .feedback-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
        }

        .feedback-msg.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
<link rel="stylesheet" href="../css/devpanel.css">
</head>

<body>
    <div class="header-top">
        <div class="container header-top__inner">
            <div class="header-top__logos">
                <div class="header-top__logo-group">
                    <img src="../assets/images/logo_fundacredesa.png" alt="Gobierno">
                    <span>Gobierno Bolivariano<br>de Venezuela</span>
                </div>
            </div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../assets/images/logo_fundacredesa.png" alt="Escudo">
                <h1>Centro de Control</h1>
                <p>Acceso exclusivo a investigadores con credenciales vigentes.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario Institucional</label>
                    <div class="input-icon">
                        <i class="fas fa-user-shield"></i>
                        <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña de Seguridad</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión Segura
                </button>

                <div id="loginFeedback" class="feedback-msg"></div>
            </form>
        </div>
    </div>

    <footer class="site-footer" style="margin-top: auto;">
        <div class="container site-footer__inner">
            <div class="site-footer__copyright">
                <i class="fas fa-shield-alt"></i><span>CONEXIÓN CIFRADA (IP WHITELIST ACTIVO)</span>
            </div>
        </div>
    </footer>

    <script src="../js/login.js"></script>
<script src="../js/devpanel.js" defer></script>
</body>

</html>
